# ══════════════════════════════════════════════════════════════════════════════
#  UTR Translation Efficiency Pipeline V5 — User Configuration
#  Edit this file, then run:  bash run_pipeline.sh
#                      or:    bash run_pipeline.sh --resume
# ══════════════════════════════════════════════════════════════════════════════

# ── Required inputs ───────────────────────────────────────────────────────────

# Sample sheet CSV: columns = Sample, Fastq_path_R1, Fastq_path_R2, Treatment, Read1_Read2, Replicate
SAMPLE_SHEET="/path/to/sample_sheet.csv"

# UTR library CSV: columns = name, sequence
UTR_CSV="/path/to/utr_sequences.csv"

# Where to write all results
OUTDIR="/path/to/results"

# ── CDS / library settings ────────────────────────────────────────────────────

# Full CDS nucleotide sequence (leave blank if using --cds_fasta below)
CDS_SEQ=""

# Library type: "5UTR" or "3UTR"
LIBRARY_TYPE="5UTR"

# Name of the CDS entry in the reference (must match your CDS sequence header)
CDS_HEADER="citrine"

# ── Analysis filters ─────────────────────────────────────────────────────────
# Minimum reads per replicate to keep a UTR-CDS combination (0 = keep all)
MIN_READS=10

# ── Compute ───────────────────────────────────────────────────────────────────
# Threads passed to cutadapt/STAR — set to your machine's core count
THREADS=4

# ── Skip steps (optional) ─────────────────────────────────────────────────────
# If you already built references on a previous run, uncomment to save time:

# GENOME_FASTA="${OUTDIR}/reference/UTR_CDS.fasta"
# CDS_FASTA="${OUTDIR}/reference/CDS.fasta"
# STAR_IDX_UTR_CDS="${OUTDIR}/reference/star_index_utr_cds"
# STAR_IDX_CDS="${OUTDIR}/reference/star_index_cds"
